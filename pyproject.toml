[project]
name = "ai_0119_rag"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.135.1",
    "flagembedding>=1.3.5",
    "grandalf>=0.8",
    "langchain>=1.3.9",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.11",
    "langgraph>=1.1.3",
    "loguru>=0.7.3",
    "mineru-kie-sdk>=0.1.1",
    "minio>=7.2.20",
    "modelscope>=1.35.1",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pillow>=12.3.0",
    "pypdf>=6.9.1,<7.0.0",
    "pymilvus[model]>=2.6.10",
    "pymilvus-model>=0.3.2",
    "pymongo>=4.16.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.31",
    "regex>=2026.2.28",
    "torch>=2.13.0",
    "tiktoken>=0.13.0",
    "uvicorn>=0.42.0",
    # FlagEmbedding 1.4.0 的 encoder-only reranker 仍调用 4.x tokenizer
    # `prepare_for_model`；Transformers 5 已移除此 API，会让真实重排失败。
    "transformers>=4.44.2,<5.0.0",
    "datasets>=4.8.4",
    "openai-agents>=0.4.2",
    "requests>=2.32.5",
    "langchain-mcp-adapters>=0.2.2",
    "dashscope>=1.25.17",
    "sqlalchemy>=2.0.43",
    "alembic>=1.17.2",
    "jieba>=0.42.1",
    "markdown>=3.10.2",
    "chardet>=7.4.3",
    "argon2-cffi>=25.1.0",
    "pydantic-settings>=2.14.2",
    "arize-phoenix-otel>=0.17.1,<0.18.0",
    "arize-phoenix-client>=2.13.0,<3.0.0",
    "openinference-instrumentation-langchain>=0.1.70,<0.2.0",
]

[tool.uv]
# 传递依赖安全下限：避免上游宽松约束在重新锁定时回退到已知漏洞版本。
override-dependencies = [
    "aiohttp>=3.14.1",
    "cryptography>=48.0.1",
    "idna>=3.15",
    "langgraph-sdk>=0.3.15,<0.4.0",
    "langsmith>=0.8.18,<1.0.0",
    "lxml>=6.1.0",
    "mcp>=1.28.1,<2.0.0",
    "pillow>=12.3.0",
    "setuptools>=83.0.0",
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.136.0",
    "pip-audit>=2.9.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "pytest-socket>=0.7.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["test", "tests"]
python_files = ["test_*.py"]
cache_dir = ".test-artifacts/cache"
addopts = "--strict-config --strict-markers"
xfail_strict = true
markers = [
    "external: requires explicitly configured real external services",
    "integration: local integration test; remains part of the default offline suite",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["app", "evals"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "evals*"]
exclude = ["logs*", "output*"]

[tool.setuptools.package-data]
"evals.baselines" = ["*.json"]
"evals.configs" = ["*.json"]
"evals.contracts" = ["*.json"]
"evals.datasets" = ["*.json"]
"evals.scenarios" = ["*.json"]

# 项目下配置环境变量(更推荐)
[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
