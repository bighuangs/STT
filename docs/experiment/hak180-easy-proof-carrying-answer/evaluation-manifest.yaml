question: "所选通用修复能否在冻结简单集上达到 correctness >= 0.95 且 strict correctness >= 0.90，并保持引用与接地安全门不退化？"
hypotheses:
  - "统一 QuestionContract、ClaimPlan 与 Evidence witness 可消除 citation、query relevance 和 completeness 三套不一致语义契约。"
  - "把完整性判定前移到渲染之前，可避免答案先被 grounding 破坏、再对残缺文本做无法证明的 set-cover。"
  - "版本化 qrel/index identity preflight 与统一 claim-support scorer 可隔离当前两类 RAG-F08。"
  - "显式章节/小节标题问题的 RETRIEVAL-only 标题路径投影可提高标题块可达性，同时保持原始与综合查询语义不变。"
  - "来源有界的表格行闭合回执可让少量 OPEN_ENUM 安全闭合；任何缺失、重复或结构不一致都继续 fail-closed 为 partial。"
  - "Evaluator 对 catalog 权威回执、canonical/packed 长度与 SHA-256 摘要及外层 AnswerProof 身份进行独立重放，并从权威正文重建 source-table-authority-summary.v1，可拒绝局部或协同重哈希的闭合伪造。"
