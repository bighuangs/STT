changed_variables:
  - "reviewer no longer self-asserts closed_obligation_ids; server derives canonical closure"
  - "first-review REPAIR becomes a deterministic full replacement plan, followed by one final semantic review"
  - "SINGLE requires exactly one strongest sufficient witness; CLOSED_COUNT requires exact count; OPEN_ENUM defaults to partial and closes only through an exact runtime-validated source table-row pair under a complete catalog"
  - "OPEN_ENUMERATION uses the complete non-empty Witness atom as a partial proven item when list/table segmentation is unavailable; only query-anchored-table-row-closure-receipt.v4 from witness-catalog-builder.v7 may upgrade one exact table-row pairing after the single-representation, full-table, identifier-semantic-header and explicit-primary-key gates pass"
  - "A query hit in a normal value/function column cannot sign a source-closure receipt; only a selected column whose header explicitly denotes identifier semantics may act as the key column"
  - "The source identity scan rejects implicit continuation, cross-representation reference/supplement, default-ignorable and Markdown-decorated duplicate keys, and selected Greek/Cyrillic-to-ASCII visual confusables; the cross-script skeleton is rejection-only and never creates a positive query anchor"
  - "Explicit chapter/section title intent adds a bounded 标题路径 expression only to RETRIEVAL subqueries under query-planner-rules/1.4.0"
  - "Source closure is nested in obligation-proof.v3 and replayed by answer-proof.v3 plus answer-coverage-decision.v4/answer-coverage.v4"
  - "Evaluation projection carries the authoritative catalog source-receipt set plus per-representation/per-Evidence length and SHA-256 summaries, then replays the outer AnswerProof and nested proof identities without exposing source text"
  - "Evaluation independently parses canonical Evidence and packed ContextPack authority text into source-table-authority-summary.v1 and compares every table boundary/shape/hash field to v4, so coordinated nested+catalog receipt drift survives neither identity rehashing nor catalog-copy replacement"
  - "Synthetic closure repair is removed; accepted-plan/server-closure mismatch converges directly to OBLIGATION_CLOSURE_UNPROVEN"
  - "WitnessCatalog cap increases within the frozen context budget"
  - "structured provider failures retain bounded safe scene/stage/reason/attempt diagnostics"
