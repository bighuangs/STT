    result: "Only title/heading intent with an explicit chapter/section reference receives a bounded idempotent 标题路径 suffix on RETRIEVAL subqueries; display/original/synthesis paths and non-title queries are unchanged."
  source_bounded_open_enumeration:
    evidence_ref: "tests/unit/test_enumeration_closure.py; tests/unit/test_proof_carrying_answer_v2.py"
    result: "query-anchored-table-row-closure-receipt.v4, built by witness-catalog-builder.v7, requires exactly one complete non-empty safe ContextPack representation; the simple Markdown table must cover the full canonical and packed representations; the query-selected column must have an explicit identifier-semantic header; and every row in that column must carry an explicit unique primary key. A query match in an ordinary value/function column, continuation/ditto rows, cross-representation references or supplements, default-ignorable characters, Markdown-formatted duplicates and selected cross-script visual confusables cannot establish identity or uniqueness."
  proof_and_coverage_replay:
    evidence_ref: "app/domain/answering/proof.py; app/application/query_answering/rendering.py; app/domain/evaluation_proof.py"
    result: "obligation-proof.v3 nests the source receipt; answer-proof.v3 and coverage v4 replay the same binding before commit. The evaluator requires an exact match in the authoritative WitnessCatalog receipt list, cross-checks full canonical/packed lengths and SHA-256 summaries, and recomputes the outer AnswerProof plus nested claim/obligation/item identities. Independently of the receipt, it parses canonical Evidence and packed ContextPack text into source-table-authority-summary.v1; canonical and packed table start/end, header line index, column count, data-row count, witness-row index, structure hash, and table/header/separator/witness-row hashes must each match v4 before acceptance."
  coordinated_tamper_guard:
    evidence_ref: "tests/unit/test_proof_carrying_answer_v2.py:test_query_anchored_table_row_closes_open_enumeration_with_replayable_proof"
    result: "Changing table_data_row_count in both the nested v4 receipt and authoritative catalog receipt, then recomputing nested obligation and outer AnswerProof identities, still fails source closure validation because the independently parsed source-table-authority-summary.v1 retains the authoritative row count and structure."
  closure_unproven_terminal:
