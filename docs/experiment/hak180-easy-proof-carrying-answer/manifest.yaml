    round2_proof_chain: "obligation-proof.v3 nests the source closure receipt; answer-proof.v3 and answer-coverage-decision.v4/answer-coverage.v4 replay it before commit. The evaluator additionally requires the exact authoritative source receipt from the WitnessCatalog projection; cross-checks canonical/packed representation lengths and SHA-256 summaries; recomputes the outer AnswerProof plus nested proof identities; and independently derives source-table-authority-summary.v1 from canonical Evidence and packed ContextPack text. Its canonical and packed table span, line, column count, data-row count, witness-row index, structure hash, and table/header/separator/witness-row hashes must each equal the v4 receipt, closing coordinated nested+catalog row-count rewrites even when all proof identities are recomputed."
    round2_closure_terminal: "Closure mismatch no longer creates synthetic repair; it terminates with OBLIGATION_CLOSURE_UNPROVEN, semantic-review-terminal.v1, no repair request or feedback, and a committable safe abstention."
    round2_candidate: "v1.6 is limited to deterministic offline engineering verification; no new paid/model easy-50 run was executed, formal effectiveness remains unmeasured, and this does not count as valid round 2."
