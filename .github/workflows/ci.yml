name: STT quality gates

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_external:
        description: "Run tests that require real external services"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: stt-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONHASHSEED: "0"
  PROJECT_ROOT: ${{ github.workspace }}

jobs:
  quality:
    name: Lock, lint, secrets and links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify lock file is current
        run: uv lock --check
      - name: Install locked quality tools only
        run: uv sync --locked --only-group dev
      - name: Run high-signal Ruff rules
        run: uv run --no-sync ruff check app evals test tests scripts --select E9,F63,F7,F82
      - name: Scan committed and unignored files for secrets
        run: uv run --no-sync python scripts/secret_scan.py
      - name: Validate local Markdown links
        run: uv run --no-sync python scripts/check_markdown_links.py

  frontend-contracts:
    name: Generated OpenAPI clients and strict TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the locked TypeScript toolchain without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reject stale OpenAPI snapshots or generated clients
        run: npm run check:generated
      - name: Type-check the scoped client, cache and error boundary
        run: npm run typecheck

  dependency-audit:
    name: Locked production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify lock file and install only the audit toolchain
        run: |
          uv lock --check
          uv sync --locked --only-group dev
          mkdir -p .test-artifacts
      - name: Export the complete locked production dependency graph
        run: >-
          uv export --locked --no-dev --no-emit-project
          --format requirements.txt
          --output-file .test-artifacts/requirements-production.txt
      - name: Fail on known vulnerabilities in locked production dependencies
        run: >-
          uv run --no-sync pip-audit
          --requirement .test-artifacts/requirements-production.txt
          --no-deps --disable-pip --strict
          --progress-spinner off
          --cache-dir .test-artifacts/pip-audit-cache
          --aliases on --desc off

  offline-tests:
    name: Deterministic offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --all-groups
      - name: Validate architecture boundaries and evaluation registries
        run: |
          uv run python -m pytest tests/architecture -q
          uv run python -m evals.harness --project-root .
      - name: Run every offline test, including local integration tests
        run: >-
          uv run pytest test tests -m "not external"
          --disable-socket --allow-unix-socket
          --allow-hosts=127.0.0.1,::1,localhost
          --timeout=120 --maxfail=1
      - name: Enforce coverage for named evaluation and RRF core modules only
        run: >-
          uv run pytest
          tests/unit/test_evaluation_metrics.py
          tests/unit/test_evaluation_reports.py
          tests/unit/test_rrf.py
          --disable-socket --allow-unix-socket
          --allow-hosts=127.0.0.1,::1,localhost
          --cov=app.evaluation.metrics
          --cov=app.evaluation.reports
          --cov=app.rag.query.rrf_service
          --cov-report=term-missing
          --cov-report=xml:.test-artifacts/core-coverage.xml
          --cov-fail-under=80
      - name: Upload named-core coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: named-core-coverage
          path: .test-artifacts/core-coverage.xml
          if-no-files-found: warn

  migration:
    name: Migrate an empty database up, down and up
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTROL_DATABASE_URL: sqlite:///./.test-artifacts/ci-migration.db
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --all-groups
      - name: Exercise the complete migration chain
        run: |
          mkdir -p .test-artifacts
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

  external-dependencies:
    name: Real dependency smoke tests
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_external)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: external-test
    env:
      STT_OPENAI_API_KEY: ${{ secrets.STT_OPENAI_API_KEY }}
      STT_OPENAI_BASE_URL: ${{ secrets.STT_OPENAI_BASE_URL }}
      STT_MILVUS_URL: ${{ secrets.STT_MILVUS_URL }}
      STT_MONGO_URL: ${{ secrets.STT_MONGO_URL }}
      STT_MINIO_ENDPOINT: ${{ secrets.STT_MINIO_ENDPOINT }}
      STT_MINIO_ACCESS_KEY: ${{ secrets.STT_MINIO_ACCESS_KEY }}
      STT_MINIO_SECRET_KEY: ${{ secrets.STT_MINIO_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --all-groups
      - name: Run explicitly marked real-service tests
        run: uv run pytest test tests -m external --enable-socket --timeout=300 --maxfail=1
